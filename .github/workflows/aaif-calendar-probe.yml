name: Temporary AAIF public calendar format probe
on:
  push:
    branches:
      - fix/wg-aaif-public-calendar-ingestion
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect public AAIF calendar HTML (no credentials)
        run: |
          python3 - <<'PY'
          import re, urllib.request
          urls = [
              "https://aaif.io/working-groups/calendar",
              "https://aaif.io/working-groups/identity-trust",
              "https://aaif.io/working-groups/observability-traceability",
              "https://aaif.io/working-groups/governance-risk-regulatory-alignment",
          ]
          for url in urls:
              print("\nURL", url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as r:
                      data=r.read(3_000_000).decode("utf-8","replace")
                      print("status",r.status,"size",len(data),"ctype",r.headers.get("Content-Type"))
                  for token in ['November 5, 2026','Identity & Trust Working Group','Governance, Risk','Observability & Tracing','__NEXT_DATA__','__next_f','startDate','calendar','ics','sanity']:
                      hits=list(re.finditer(re.escape(token),data,re.I))
                      print(token, len(hits))
                      for m in hits[:2]:
                          print("SAMPLE",repr(data[max(0,m.start()-180):m.end()+220]))
                  print("SCRIPTS",re.findall(r'<script[^>]+src="([^"]+)"',data)[:8])
              except Exception as exc:
                  print("ERROR",type(exc).__name__,str(exc)[:300])
          PY
