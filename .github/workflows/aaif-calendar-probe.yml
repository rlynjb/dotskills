name: Temporary live AAIF calendar adapter smoke test
on:
  push:
    branches: [fix/wg-aaif-public-calendar-ingestion]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Live public-AAIF event check (no credentials)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import importlib.util
          path=Path("skills/track-working-groups/scripts/wg.py")
          spec=importlib.util.spec_from_file_location("wg",path)
          wg=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(wg)
          now=datetime(2026,11,5,15,0,tzinfo=timezone.utc)
          events=wg.parse_aaif_calendar(wg.fetch_aaif_calendar(),now,14)
          print("SAFE EVENT COUNT",len(events))
          slugs={"identity-trust","observability-traceability","governance-risk-regulatory-alignment"}
          today=[e for e in events if e["starts_at"].startswith("2026-11-05") and e["group_slug"] in slugs]
          for e in today:
              print(e["group_slug"],e["id"],e["starts_at"],wg.format_pacific(e["starts_at"]))
          assert slugs <= set(e["group_slug"] for e in today), "Expected three Nov 5 public events in official page"
          assert all(e["url"].startswith("https://aaif.io/working-groups/") for e in events)
          assert all("zoom" not in str(e).lower() for e in events)
          PY
