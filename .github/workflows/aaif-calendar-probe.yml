name: Temporary AAIF public calendar feed discovery
on:
  push:
    branches: [fix/wg-aaif-public-calendar-ingestion]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect official site HTML and Javascript for public calendar endpoints
        run: |
          python3 - <<'PY'
          import re, html, urllib.request,urllib.parse
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=25) as r:
                  return r.read(3_000_000).decode("utf-8","replace")
          u="https://aaif.io/working-groups/calendar"
          s=get(u)
          print("HTML size",len(s))
          scripts=list(dict.fromkeys(re.findall(r'<script[^>]+src="([^"]+)"',s)))
          print("Script count",len(scripts))
          words=["api.lfx","lfx.dev","events/","/api/","calendar","meeting","eventCalendar","sanity","startTime","meetingId","eventDate","getEvents"]
          for word in words:
              matches=list(re.finditer(re.escape(word),s,re.I))
              print("HTML",word,len(matches))
              for m in matches[:2]:
                  print("  ",repr(s[max(0,m.start()-120):m.end()+200]))
          print("HTML lfx urls", list(dict.fromkeys(re.findall(r'https?[^"\\\\ ]{0,180}lfx[^"\\\\ ]*',s,re.I)))[:20])
          for path in scripts:
              url=urllib.parse.urljoin(u,path)
              try:
                  js=get(url)
              except Exception as e:
                  print("JS FAIL",path,str(e)[:100])
                  continue
              matches={}
              for word in ["api.lfx","lfx.dev","/api/","event-calendar","meeting","calendar","eventStart","startDate","sanity"]:
                  n=list(re.finditer(re.escape(word),js,re.I))
                  if n:matches[word]=len(n)
              if matches.get("lfx.dev") or matches.get("api.lfx") or (matches.get("meeting",0)>4 and matches.get("calendar",0)>4) or matches.get("event-calendar"):
                  print("MATCHED JS",path,"len",len(js),"counts",matches)
                  for word in ["api.lfx","lfx.dev","/api/","event-calendar","getEvents","meeting","calendar"]:
                      for m in list(re.finditer(re.escape(word),js,re.I))[:2]:
                          print("  ",word,repr(js[max(0,m.start()-190):m.end()+280]))
          PY
