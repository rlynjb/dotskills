name: Validate DotSkills Repository Integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill repository integrity
        run: python3 scripts/validate_skill_repository_integrity.py
      - name: Test Claude Code adapter
        run: python3 -m unittest discover -s adapters/claude -p "test_*.py" -v
